<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Portal Home</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; padding: 50px; }
    h1 { color: #333; }
    .role-container { display: flex; justify-content: center; gap: 20px; margin-top: 40px; }
    .role-card { background: white; padding: 20px 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 200px; }
    .role-card a { display: block; margin-top: 15px; padding: 10px; background: #0e481b; color: white; text-decoration: none; border-radius: 5px; }
    .role-card a:hover { background: #0e481b; }
  </style>
</head>
<body>

  <h1>Welcome to DevTriCode Job Portal</h1>
  <p>Select your role to login:</p>

  <div class="role-container">
    <div class="role-card">
      <h3>Admin</h3>
      <a href="admin-login.html">Login as Admin</a>
    </div>
    <div class="role-card">
      <h3>Candidate</h3>
      <a href="candidate-login.html">Login as Candidate</a>
    </div>
    <div class="role-card">
      <h3>Employer</h3>
      <a href="employer-login.html">Login as Employer</a>
    </div>
  </div>
<script src="1app.js"></script>
</body>
</html>
