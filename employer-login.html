<!DOCTYPE html> 
<html lang="en">
   <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Login - DevTriCode Job Portal</title> 
     <link rel="stylesheet" href="user.css"> 
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"> 
     </head> <body>
       <div class="container"> 
        <!-- Left Side --> <div class="left-section"> 
          <img src="images/logo.png.png" alt="Company Logo"> 
          <h1>DevTriCode</h1>
           <p>Empowering developers to connect, code, and create together.</p>
           </div> <!-- Right Side --> 
           <div class="right-section"> 
            <div class="login-box"> 
              <h2>Sign In</h2>
           <form id="userLoginForm">
      <label>Email</label>
      <input type="email" id="userEmail" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" id="userPassword" placeholder="Enter your password" required>

      <a href="#" class="forgot">Forgot Password?</a>

      <button type="submit" class="btn">Login</button>
    </form>
    <p class="signup-text">Don’t have an account? <a href="#">Sign Up</a></p>
              </p> 
            </div> 
            </div>
           </div> 
           <script src="1app.js"></script>
          </body>
           </html>
