<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Jobs - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <img src="images/logo.png.png" alt="DevTriCode Logo" class="logo">
    <h2>Admin Panel</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="manage-users.html">Manage Users</a>
      <a href="manage-jobs.html" class="active">Manage Jobs</a>
      <a href="../index.html">Logout</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <h1>Manage Jobs</h1>

    <table class="job-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Job Title</th>
          <th>Company</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>01</td>
          <td>Frontend Developer</td>
          <td>DevTriCode</td>
          <td>Active</td>
          <td>
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">Delete</button>
          </td>
        </tr>
        <tr>
          <td>02</td>
          <td>Backend Developer</td>
          <td>DevTriCode</td>
          <td>Pending</td>
          <td>
            <button class="edit-btn">Edit</button>
            <button class="delete-btn">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
