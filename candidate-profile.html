<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Job Portal</title>
  <link rel="stylesheet" href="candidate.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>User Panel</h2>
    <nav>
      <a href="candidate-dashboard.html">Dashboard</a>
      <a href="browse-jobs.html">Browse Jobs</a>
      <a href="profile.html" class="active">Profile</a>
      <a href="applications.html">My Applications</a>
      <a href="logout.html">Logout</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <h1>User Profile</h1>
    <p>Update your personal details and upload your resume.</p>

    <form id="profileForm" class="profile-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email">

      <label for="skills">Skills</label>
      <textarea id="skills" rows="3" placeholder="e.g., HTML, CSS, JavaScript, React"></textarea>

      <label for="resume">Upload Resume</label>
      <input type="file" id="resume" accept=".pdf,.doc,.docx">

      <button type="submit" class="submit-btn">Save Profile</button>
    </form>
  </main>

  <script src="1app.js"></script>
</body>
</html>
