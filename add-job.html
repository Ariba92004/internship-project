<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Job - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <img src="images/logo.png.png" alt="DevTriCode Logo" class="logo">
    <h2>Admin Panel</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="manage-users.html">Manage Users</a>
      <a href="manage-jobs.html">Manage Jobs</a>
      <a href="add-job.html" class="active">Add Job</a>
      <a href="../index.html">Logout</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <h1>Add New Job</h1>

    <form class="job-form" id="jobForm">
      <label for="title">Job Title</label>
      <input type="text" id="title" name="title" placeholder="e.g. Frontend Developer" required>

      <label for="company">Company Name</label>
      <input type="text" id="company" name="company" placeholder="e.g. DevTriCode" required>

      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="e.g. Lahore, Pakistan" required>

      <label for="type">Job Type</label>
      <select id="type" name="type" required>
        <option value="">-- Select Type --</option>
        <option value="Full Time">Full Time</option>
        <option value="Part Time">Part Time</option>
        <option value="Internship">Internship</option>
      </select>

      <label for="description">Job Description</label>
      <textarea id="description" name="description" rows="5" placeholder="Write job details..." required></textarea>

      <button type="submit" class="submit-btn">Add Job</button>
    </form>
  </main>

  <script src="admin-jobs.js"></script>
</body>
</html>
