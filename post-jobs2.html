<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post a Job - Employer Dashboard</title>
  <link rel="stylesheet" href="employer-dashboard.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Employer Panel</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="manage-jobs.html">Manage Jobs</a>
      <a href="post-job.html" class="active">Post a Job</a>
      <a href="../index.html">Logout</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <h1>Post a New Job 🌿</h1>

    <form id="postJobForm" class="job-form">
      <label>Job Title</label>
      <input type="text" id="title" placeholder="e.g. Frontend Developer" />

      <label>Company Name</label>
      <input type="text" id="company" placeholder="e.g. DevTriCode Pvt. Ltd." />

      <label>Location</label>
      <input type="text" id="location" placeholder="e.g. Remote / Karachi / Lahore" />

      <label>Job Type</label>
      <select id="type">
        <option value="">Select Type</option>
        <option>Full-Time</option>
        <option>Part-Time</option>
        <option>Internship</option>
      </select>

      <label>Salary Range</label>
      <input type="text" id="salary" placeholder="e.g. Rs. 60,000 - Rs. 100,000" />

      <label>Job Description</label>
      <textarea id="description" rows="5" placeholder="Write a short job description..."></textarea>

      <button type="submit" class="submit-btn">Post Job</button>
    </form>
  </main>

  <script src="post-job.js"></script>
</body>
</html>
