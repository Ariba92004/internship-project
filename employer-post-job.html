<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job - Employer Dashboard</title>
  <link rel="stylesheet" href="employer-dashboard.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <img src="images/logo.png.png" alt="Logo" class="logo">
    <h2>Employer Panel</h2>
    <nav>
      <a href="employer-dashboard.html">Dashboard</a>
      <a href="employer-post-job.html" class="active">Post a Job</a>
      <a href="employer-manage-jobs.html">Manage Jobs</a>
      <a href="logout.html">Logout</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <h1>Post a New Job</h1>
    <form class="job-form" id="postJobForm">
      <label for="title">Job Title</label>
      <input type="text" id="title" placeholder="e.g. Frontend Developer"><br><br>

      <label for="company">Company Name</label>
      <input type="text" id="company" placeholder="e.g. DevTriCode Pvt Ltd"><br><br>

      <label for="location">Location</label>
      <input type="text" id="location" placeholder="e.g. Karachi, Pakistan"><br><br>

      <label for="type">Job Type</label>
      <select id="type">
        <option value="">Select Type</option>
        <option value="Full-Time">Full-Time</option>
        <option value="Part-Time">Part-Time</option>
        <option value="Internship">Internship</option>
      </select><br><br>

      <label for="salary">Salary Range</label>
      <input type="text" id="salary" placeholder="e.g. Rs 80,000 - 120,000"><br><br>

      <label for="description">Job Description</label>
      <textarea id="description" rows="4" placeholder="Enter job details..."></textarea><br><br>

      <button type="submit" class="submit-btn">Post Job</button>
    </form>
  </main>

  <script src="1app.js"></script>
</body>
</html>
