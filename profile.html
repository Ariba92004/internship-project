<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="profile.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="profile.js"></script>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">DevTriCode</div>
    <nav>
      <a href="user_home.html">Home</a>
      <a href="jobs.html">Jobs</a>
      <a href="profile.html" class="active">Profile</a>
      <a href="login.html">Logout</a>

  </header>

  <!-- Profile Section -->
  <section class="profile-section">
    <div class="profile-card">
      <img src="images/profile-placeholder.png" alt="Profile Picture" class="profile-pic">
      <h2>Ariba Fatima</h2>
      <p><strong>Email:</strong>aribafatima932004@gmail.com</p>
      <p><strong>Location:</strong> Lahore, Pakistan</p>
      <p><strong>Skills:</strong> HTML, CSS, JavaScript, Node.js</p>

      <button class="edit-btn">Edit Profile</button>
    </div>

    <div class="profile-form">
      <h3>Update Your Information</h3>
      <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Skills</label>
        <input type="text" placeholder="e.g., React, MongoDB, Express">

        <label>Upload Resume</label>
        <input type="file" accept=".pdf,.doc,.docx">

        <button type="submit" class="save-btn">Save Changes</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 DevTriCode | All Rights Reserved</p>
  </footer>
