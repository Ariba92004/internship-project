<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Login - DevTriCode</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="candidate.css">
</head>
<body>
  <div class="login-container">
    <h2>Candidate Login</h2>
    <form id="candidateLoginForm">
      <input type="text" id="candidateUsername" placeholder="Username" required>
      <input type="password" id="candidatePassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <script src="candidate-login.js"></script>
</body>
</html>
